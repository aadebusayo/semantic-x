[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "semantic-x"
version = "0.1.0"
description = "A universal, domain-agnostic AI agent orchestration framework for building intelligent conversational AI systems"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "SemanticX Contributors", email = "aadebusayo.adewunmi@gmail.com"}
]
keywords = [
    "ai",
    "agents",
    "llm",
    "orchestration",
    "conversational-ai",
    "framework"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.23.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.0.0",
    "httpx>=0.25.0",
    "python-multipart>=0.0.6",
    "openai>=1.75.0",
    "prometheus-client>=0.20.0",
    "qdrant-client>=1.8.2",
    "tenacity>=8.2.0",
    "emoji>=2.8.0",
    "python-dateutil>=2.8.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "isort>=5.12.0"
]
docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.0.0",
    "mkdocstrings[python]>=0.24.0"
]

[project.urls]
Homepage = "https://github.com/aadebusayo/semantic-x"
Documentation = "https://github.com/aadebusayo/semantic-x/wiki"
Repository = "https://github.com/aadebusayo/semantic-x.git"
Issues = "https://github.com/aadebusayo/semantic-x/issues"

[tool.setuptools]
packages = ["core", "services", "models", "agents", "api", "prompts", "utils"]

[tool.setuptools.package-data]
prompts = ["**/*.txt", "**/*.json"]
schemas = ["**/*.json"]

[tool.black]
line-length = 100
target-version = ['py39', 'py310', 'py311', 'py312']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
multi_line_mode = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
line_length = 100
skip_gitignore = true
