[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "semantic-x"
version = "0.1.0"
description = "Infosearch REST API: Azure AI Search semantic+vector retrieval, chat summaries with citations, and Cosmos DB history"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "SemanticX Contributors", email = "aadebusayo.adewunmi@gmail.com"}
]
keywords = [
    "azure-ai-search",
    "cosmos-db",
    "vector-search",
    "semantic-search",
    "chat",
    "fastapi"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.23.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.0.0",
    "azure-search-documents[aio]>=11.5.0",
    "azure-cosmos>=4.6.0",
    "azure-storage-blob>=12.20.0",
    "azure-storage-file-datalake>=12.16.0",
    "pypdf>=4.0.0",
    "python-docx>=1.1.2",
    "openpyxl>=3.1.5",
    "python-pptx>=1.0.2",
    "tenacity>=8.2.0",
    "openai>=1.40.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "isort>=5.12.0"
]
docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.0.0",
    "mkdocstrings[python]>=0.24.0"
]

[project.urls]
Homepage = "https://github.com/aadebusayo/semantic-x"
Documentation = "https://github.com/aadebusayo/semantic-x/wiki"
Repository = "https://github.com/aadebusayo/semantic-x.git"
Issues = "https://github.com/aadebusayo/semantic-x/issues"

[tool.setuptools]
packages = ["api", "models", "services", "utils"]

[tool.setuptools.package-data]
prompts = ["**/*.txt", "**/*.json"]
schemas = ["**/*.json"]

[tool.black]
line-length = 100
target-version = ['py39', 'py310', 'py311', 'py312']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
multi_line_mode = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
line_length = 100
skip_gitignore = true
